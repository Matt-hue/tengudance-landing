name: Build

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Registry paths must be lowercase, even though the GitHub account name is not.
  IMAGE: ghcr.io/matt-hue/tengudance-landing

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tengudance-landing.sln
      - run: dotnet build tengudance-landing.sln --configuration Release --no-restore
      - run: dotnet test tengudance-landing.sln --configuration Release --no-build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build into the runner's Docker engine only: nothing reaches the registry until the
      # smoke test passes, so every tag on GHCR is an image that passed it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          build-args: |
            APP_VERSION=${{ github.sha }}
      # Runs the image under the server's memory limit. There is no proxy here, so /status
      # would rightly report 503; only / and /healthz are checked.
      - name: Smoke test image
        run: |
          docker run -d --name landing-smoke --memory 256m -p 127.0.0.1:8080:8080 "$IMAGE:$GITHUB_SHA"
          trap 'docker logs landing-smoke; docker rm --force landing-smoke' EXIT
          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' landing-smoke)"
            [ "$health" = starting ] || break
            sleep 2
          done
          echo "Container health: $health"
          [ "$health" = healthy ]
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          [ "$(curl --fail --silent --show-error http://127.0.0.1:8080/version)" = "$GITHUB_SHA" ]
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"

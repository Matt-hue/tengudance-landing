name: Build

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tengudance-landing.sln
      - run: dotnet build tengudance-landing.sln --configuration Release --no-restore
      - run: dotnet test tengudance-landing.sln --configuration Release --no-build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/matt-hue/tengudance-landing:${{ github.sha }}
            ghcr.io/matt-hue/tengudance-landing:main
          build-args: |
            APP_VERSION=${{ github.sha }}
      - name: Verify pushed image
        env:
          IMAGE: ghcr.io/matt-hue/tengudance-landing:${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          docker run -d --name landing-smoke -p 127.0.0.1::8080 "$IMAGE"
          for attempt in $(seq 1 90); do
            health="$(docker inspect --format='{{.State.Health.Status}}' landing-smoke)"
            if [ "$health" = "healthy" ]; then
              break
            fi
            if [ "$health" = "unhealthy" ]; then
              docker logs landing-smoke
              exit 1
            fi
            sleep 2
          done
          if [ "$health" != "healthy" ]; then
            docker logs landing-smoke
            exit 1
          fi
          port="$(docker port landing-smoke 8080/tcp | sed 's/.*://')"
          curl --fail --silent --show-error "http://127.0.0.1:${port}/"
          curl --fail --silent --show-error "http://127.0.0.1:${port}/healthz"
          docker rm --force landing-smoke
